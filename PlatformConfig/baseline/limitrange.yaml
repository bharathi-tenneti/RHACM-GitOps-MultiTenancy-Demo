apiVersion: v1
kind: LimitRange
metadata:
  name: platform-default-limits
  namespace: platform-config
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 64Mi
      max:
        cpu: "4"
        memory: 4Gi
    - type: Pod
      max:
        cpu: "8"
        memory: 8Gi
