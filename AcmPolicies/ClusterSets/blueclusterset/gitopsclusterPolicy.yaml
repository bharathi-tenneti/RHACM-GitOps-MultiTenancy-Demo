apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: blue-gitopscluster
  namespace: acm-gitops-policy
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS Data Security
    policy.open-cluster-management.io/controls: PR.DS-1 Data-at-rest
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: blue-gitopscluster
        spec:
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            exclude:
              - kube-*
            include:
              - default
          object-templates:
            # Bind blueclusterset to fleet-gitops so blue-placement can be used here.
            # fleet-argocd already has cluster secrets for all clusters via fleet-placement/global.
            # blue-placement is used only as a label selector by the blue team ApplicationSet generator.
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta2
                kind: ManagedClusterSetBinding
                metadata:
                  name: blueclusterset
                  namespace: fleet-gitops
                spec:
                  clusterSet: blueclusterset
            - complianceType: musthave
              objectDefinition:
                apiVersion: cluster.open-cluster-management.io/v1beta1
                kind: Placement
                metadata:
                  name: blue-placement
                  namespace: fleet-gitops
                spec:
                  clusterSets:
                    - blueclusterset
                  predicates:
                    - requiredClusterSelector:
                        labelSelector:
                          matchLabels:
                            vendor: OpenShift
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: blue-gitopscluster
  namespace: acm-gitops-policy
placementRef:
  name: acm-hub-cluster
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
  - name: blue-gitopscluster
    kind: Policy
    apiGroup: policy.open-cluster-management.io
