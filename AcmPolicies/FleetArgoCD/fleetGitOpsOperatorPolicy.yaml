apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: fleet-gitops-operator-install
  namespace: acm-gitops-policy
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS Data Security
    policy.open-cluster-management.io/controls: PR.DS-1 Data-at-rest
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: fleet-gitops-operator-install
        spec:
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            exclude:
              - kube-*
            include:
              - default
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: operators.coreos.com/v1alpha1
                kind: Subscription
                metadata:
                  name: openshift-gitops-operator
                  namespace: openshift-operators
                  labels:
                    operators.coreos.com/openshift-gitops-operator.openshift-operators: ''
                spec:
                  channel: latest
                  installPlanApproval: Automatic
                  name: openshift-gitops-operator
                  source: redhat-operators
                  sourceNamespace: openshift-marketplace
---
# Reuses the all-managed-clusters PlacementRule defined in fleetArgoCDAgentPolicy.yaml.
# This policy must become Compliant (operator running) on each spoke before
# fleetArgoCDAgentPolicy.yaml is applied, so that the ArgoCD CR has an operator to reconcile it.
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: fleet-gitops-operator-install
  namespace: acm-gitops-policy
placementRef:
  name: all-managed-clusters
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
  - name: fleet-gitops-operator-install
    kind: Policy
    apiGroup: policy.open-cluster-management.io
