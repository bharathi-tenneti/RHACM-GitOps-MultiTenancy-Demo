apiVersion: policy.open-cluster-management.io/v1
kind: Policy
metadata:
  name: fleet-argocd-agent
  namespace: acm-gitops-policy
  annotations:
    policy.open-cluster-management.io/standards: NIST-CSF
    policy.open-cluster-management.io/categories: PR.DS Data Security
    policy.open-cluster-management.io/controls: PR.DS-1 Data-at-rest
spec:
  remediationAction: enforce
  disabled: false
  policy-templates:
    - objectDefinition:
        apiVersion: policy.open-cluster-management.io/v1
        kind: ConfigurationPolicy
        metadata:
          name: fleet-argocd-agent
        spec:
          remediationAction: enforce
          severity: medium
          namespaceSelector:
            exclude:
              - kube-*
            include:
              - default
          object-templates:
            - complianceType: musthave
              objectDefinition:
                apiVersion: v1
                kind: Namespace
                metadata:
                  name: argocd-agent
            - complianceType: musthave
              objectDefinition:
                apiVersion: argoproj.io/v1beta1
                kind: ArgoCD
                metadata:
                  name: argocd-agent
                  namespace: argocd-agent
                spec:
                  # Agent has no UI — the Principal on the hub provides visibility.
                  server:
                    enabled: false
                  argoCDAgent:
                    agent:
                      mode: managed
                      principal:
                        # Address of the Principal gRPC endpoint on the hub.
                        # Update this value after the Principal route is provisioned.
                        # Tip: use ACM hub templating to auto-populate:
                        #   {{hub (lookup "v1" "Route" "openshift-gitops" "fleet-argocd-principal-server").spec.host hub}}
                        address: "fleet-argocd-principal-server-openshift-gitops.apps.<hub-cluster-domain>:443"
                        tls:
                          insecure: false
---
# PlacementRule targeting all managed spoke clusters, explicitly excluding the hub.
apiVersion: apps.open-cluster-management.io/v1
kind: PlacementRule
metadata:
  name: all-managed-clusters
  namespace: acm-gitops-policy
spec:
  clusterSelector:
    matchExpressions:
      - key: local-cluster
        operator: NotIn
        values:
          - "true"
---
apiVersion: policy.open-cluster-management.io/v1
kind: PlacementBinding
metadata:
  name: fleet-argocd-agent
  namespace: acm-gitops-policy
placementRef:
  name: all-managed-clusters
  kind: PlacementRule
  apiGroup: apps.open-cluster-management.io
subjects:
  - name: fleet-argocd-agent
    kind: Policy
    apiGroup: policy.open-cluster-management.io
