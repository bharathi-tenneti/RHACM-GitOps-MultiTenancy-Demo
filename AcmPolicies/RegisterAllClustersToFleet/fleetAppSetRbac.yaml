apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fleet-gitops-appset-placementdecision
  namespace: fleet-gitops
rules:
  - apiGroups:
      - cluster.open-cluster-management.io
    resources:
      - placementdecisions
    verbs:
      - list
      - get
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fleet-gitops-appset-placementdecision
  namespace: fleet-gitops
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fleet-gitops-appset-placementdecision
subjects:
  - kind: ServiceAccount
    name: fleet-argocd-applicationset-controller
    namespace: fleet-gitops
